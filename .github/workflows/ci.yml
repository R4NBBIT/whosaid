name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: 개인 데이터 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 녹음·목소리 지문·모델·API 키가 레포에 없는지 확인
        run: python3 scripts/check_private_data.py --all

  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: 화자 분리 모델과 공개 예제 녹음 받기
        run: bash scripts/fetch_test_models.sh "$RUNNER_TEMP/models"
      - name: pytest
        env:
          WHOSAID_TEST_MODELS: ${{ runner.temp }}/models
        run: pytest -v

  windows-e2e:
    name: 전 과정 점검 (Windows, pip 설치)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: 공개 예제 녹음 받기
        shell: bash
        run: bash scripts/fetch_test_models.sh "$RUNNER_TEMP/models"
      - name: 녹음 → 화자 분리 → 등록/식별 → 받아쓰기 → 내장 LLM 요약
        shell: bash
        env:
          WHOSAID_HOME: ${{ runner.temp }}/whosaid-home
          PYTHONIOENCODING: utf-8
        run: >
          python -m whosaid selftest "$RUNNER_TEMP/models/0-four-speakers-zh.wav"
          --whisper tiny --language zh
          --llm "hf:bartowski/Qwen2.5-0.5B-Instruct-GGUF/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"

  windows-build:
    name: 윈도우 프로그램 빌드
    needs: [privacy, test]
    uses: ./.github/workflows/build-windows.yml
